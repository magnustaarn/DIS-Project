<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WikiSpeedrun{% endblock %}</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --mid: #666666;
      --accent: #111111;
      --accent2: #333333;
      --rule: #dddddd;
      --card: #f7f7f7;
      --mono: Arial, sans-serif;
      --serif: Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 14px;
      min-height: 100vh;
    }

    nav {
      border-bottom: 1px solid var(--rule);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background: var(--bg);
      color: var(--ink);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.75;
      transition: opacity 0.15s;
    }

    nav a:hover { opacity: 1; }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    h1 {
      font-family: var(--serif);
      font-size: 2.8rem;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    h2 {
      font-family: var(--serif);
      font-size: 1.6rem;
      margin-bottom: 16px;
    }

    .subtitle {
      color: var(--mid);
      margin-bottom: 40px;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 28px 32px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--mid);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 0;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 18px;
    }

    input:focus { border-color: var(--ink); }

    .btn {
      display: inline-block;
      padding: 10px 28px;
      background: var(--ink);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--accent); }

    .btn-outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
    }

    .btn-outline:hover { background: var(--ink); color: var(--bg); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--mid);
      border-bottom: 2px solid var(--rule);
      padding: 6px 12px;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--rule);
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(0,0,0,0.03); }

    .error {
      background: #fde8e8;
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      font-size: 13px;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .stats-row {
      display: flex;
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-box {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 20px 24px;
      text-align: center;
    }

    .stat-num {
      font-family: var(--serif);
      font-size: 2.4rem;
      display: block;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--mid);
    }

    hr.rule { border: none; border-top: 1px solid var(--rule); margin: 32px 0; }

    .rank { color: var(--mid); font-size: 12px; }
    .rank-1 { color: #b8860b; font-weight: 600; }
    .rank-2 { color: var(--mid); }
    .rank-3 { color: #8b6914; }

    a { color: var(--accent2); }
    a:hover { color: var(--accent); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <ul>
      <li><a href="{{ url_for('game.index') }}">Home</a></li>
      <li><a href="{{ url_for('game.leaderboard') }}">Leaderboard</a></li>
      <li><a href="{{ url_for('game.play_setup') }}">Play</a></li>
    </ul>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
